name: Build ingestor image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "ingestor/**"
      - "lib/**"
      - "utils/certgen/**"
      - "build_ingestor.sh"
      - ".github/workflows/build-ingestor.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and save image
        run: sh ./build_ingestor.sh ingestor/Dockerfile ingestor

      - name: Upload ingestor.tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: ingestor-image
          path: ingestor.tar.gz
          retention-days: 14
          compression-level: 0
